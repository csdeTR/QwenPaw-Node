name: Release

# 推一个 v* 的 tag 就会编译两个变体 × 四个架构的 release 包，并挂到对应的 GitHub Release：
#   full      支持本地识别（sherpa-onnx）与服务端转写二选一，默认本地
#   nosherpa  只支持服务端转写，包体小约 22MB，文件名带 -no-sherpa
# 需要在仓库 Settings → Secrets and variables → Actions 里配置四项：
#   ANDROID_KEYSTORE_BASE64   release.jks 的 base64（单行，不含换行）
#   ANDROID_KEYSTORE_PASSWORD  storePassword
#   ANDROID_KEY_ALIAS          keyAlias
#   ANDROID_KEY_PASSWORD       keyPassword
# 签名密钥不进仓库，这里只做一次性解码，随 runner 一起销毁。

on:
  push:
    tags: [ 'v*' ]
  workflow_dispatch:
    inputs:
      tag:
        description: '要发布的 tag（需已存在于仓库）'
        required: true

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    env:
      # 手动触发时 github.ref_name 是分支名，必须用输入的 tag
      TAG: ${{ inputs.tag || github.ref_name }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref_name }}

      - name: 设置 JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: 安装 Android SDK 35
        run: |
          SDKMANAGER=$(ls "$ANDROID_HOME"/cmdline-tools/*/bin/sdkmanager 2>/dev/null | tail -1)
          if [ -z "$SDKMANAGER" ]; then
            echo "::error::runner 上找不到 sdkmanager"
            exit 1
          fi
          yes | "$SDKMANAGER" --licenses > /dev/null 2>&1 || true
          "$SDKMANAGER" "platform-tools" "platforms;android-35" "build-tools;35.0.0"

      - name: 启用 Gradle 缓存
        uses: gradle/actions/setup-gradle@v4

      - name: 解码签名密钥
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "::error::缺少 ANDROID_KEYSTORE_BASE64，无法签名。请在仓库 Settings → Secrets 中配置四项签名密钥。"
            exit 1
          fi
          KEYDIR="$RUNNER_TEMP/keys"
          mkdir -p "$KEYDIR"
          printf '%s' "$KEYSTORE_BASE64" | base64 -d > "$KEYDIR/release.jks"
          {
            echo "storeFile=$KEYDIR/release.jks"
            echo "storePassword=$KEYSTORE_PASSWORD"
            echo "keyAlias=$KEY_ALIAS"
            echo "keyPassword=$KEY_PASSWORD"
          } > "$KEYDIR/keystore.properties"
          echo "QWENPAW_KEYSTORE_PROPERTIES=$KEYDIR/keystore.properties" >> "$GITHUB_ENV"

      - name: 运行 JVM 单测
        run: |
          set +e
          ./gradlew :app:testFullDebugUnitTest :app:testNosherpaDebugUnitTest --stacktrace 2>&1 | tee /tmp/build.log
          code=${PIPESTATUS[0]}
          if [ "$code" -ne 0 ]; then
            MSG=$(awk '/What went wrong/{f=1} f{print} /Get more help/{f=0}' /tmp/build.log | tr '\n' ' ')
            [ -z "$MSG" ] && MSG=$(tail -n 40 /tmp/build.log | tr '\n' ' ')
            echo "::error title=Gradle 失败::$(printf '%s' "$MSG" | cut -c1-1200)"
          fi
          exit "$code"

      - name: 编译两个变体 × 四个架构的 release 包
        run: |
          set +e
          ./gradlew :app:assembleRelease --stacktrace 2>&1 | tee /tmp/build.log
          code=${PIPESTATUS[0]}
          if [ "$code" -ne 0 ]; then
            MSG=$(awk '/What went wrong/{f=1} f{print} /Get more help/{f=0}' /tmp/build.log | tr '\n' ' ')
            [ -z "$MSG" ] && MSG=$(tail -n 40 /tmp/build.log | tr '\n' ' ')
            echo "::error title=Gradle 失败::$(printf '%s' "$MSG" | cut -c1-1200)"
          fi
          exit "$code"

      # 加了 flavor 之后产物落在 apk/<flavor>/release/，不再是 apk/release/。
      - name: 校验签名有效
        run: |
          TOOL=$(ls "$ANDROID_HOME"/build-tools/*/apksigner 2>/dev/null | tail -1)
          if [ -z "$TOOL" ]; then
            echo "::error::找不到 apksigner，无法确认签名"
            exit 1
          fi
          for f in $(find app/build/outputs/apk -path "*/release/*.apk"); do
            "$TOOL" verify --print-certs "$f" > /dev/null || {
              echo "::error::$f 签名校验失败，不发布未签名的包"
              exit 1
            }
          done

      # 产物名要能一眼分出变体与架构：
      #   QwenPaw-Node-v0.4.0-arm64-v8a.apk
      #   QwenPaw-Node-v0.4.0-no-sherpa-arm64-v8a.apk
      # Gradle 的 flavor 名是 nosherpa，按用户可见的说法改成 no-sherpa。
      - name: 按版本重命名产物
        run: |
          mkdir -p dist
          for f in $(find app/build/outputs/apk -path "*/release/*.apk"); do
            # 变体取自目录名（apk/<flavor>/release/xxx.apk），ABI 取自文件名：
            # ABI 里本身带连字符（armeabi-v7a），不能靠切最后一段解析。
            VARIANT=$(basename "$(dirname "$(dirname "$f")")")
            ABI=$(basename "$f" | sed -E "s/^app-${VARIANT}-//; s/-release\.apk$//")
            case "$VARIANT" in
              full) SUFFIX="" ;;
              nosherpa) SUFFIX="-no-sherpa" ;;
              *) echo "::error::未知变体 $VARIANT（$f）"; exit 1 ;;
            esac
            cp "$f" "dist/QwenPaw-Node-${TAG}${SUFFIX}-${ABI}.apk"
          done
          ls -l dist
          # 两个变体各四个包，少一个就说明某个变体没编出来。
          COUNT=$(ls dist/*.apk | wc -l)
          if [ "$COUNT" -ne 8 ]; then
            echo "::error::应有 8 个包（2 变体 × 4 架构），实际 $COUNT 个"
            exit 1
          fi

      # Release 正文里的「本版变化」直接取 CHANGELOG 的同版本小节，避免两处各写一份。
      # 抽不到时（版本号与 tag 不一致、CHANGELOG 缺该版）不静默通过：
      # 正文缺一段比发出去的说明与代码对不上更难发现。
      - name: 拼装 Release 正文
        run: |
          FIRST=$(grep -m1 '^## ' CHANGELOG.md)
          if [[ "$FIRST" != "## ${TAG}" && "$FIRST" != "## ${TAG} "* ]]; then
            echo "::error::CHANGELOG 首个版本小节是「$FIRST」，与 tag ${TAG} 不一致"
            exit 1
          fi
          sed '1,/^## /d' CHANGELOG.md | sed '/^## /,$d' | sed '1d' > /tmp/release-notes.md
          if [ ! -s /tmp/release-notes.md ]; then
            echo "::error::CHANGELOG.md 的 ${TAG} 小节为空"
            exit 1
          fi
          {
            echo 'RELEASE_BODY<<RELEASE_BODY_EOF'
            cat /tmp/release-notes.md
            echo
            echo '## 安装包'
            echo
            echo '每个架构出两个变体，按需下载：'
            echo
            echo '| 变体 | 语音 | 体积 | 说明 |'
            echo '| --- | --- | --- | --- |'
            echo '| 标准包 | 本地识别或服务端转写（二选一，默认本地） | 约 25MB | 需要离线可用与实时字幕时选择这一种 |'
            echo '| `-no-sherpa` | 仅服务端转写 | 约 2.4MB | 不需要离线识别时可省下约 22MB |'
            echo
            echo '文件名里的架构部分与之对应：'
            echo
            echo '| 架构 | 说明 |'
            echo '| --- | --- |'
            echo '| `arm64-v8a` | 已实测。2019 年之后发布的绝大多数手机 |'
            echo '| `x86_64` | 已实测。用于模拟器 |'
            echo '| `armeabi-v7a` | **未实测**，仅为兼容 32 位旧设备而构建 |'
            echo '| `x86` | **未实测**，仅为兼容 32 位模拟器而构建 |'
            echo
            echo '未实测的两个包只确认可以编译产出，不保证安装或运行。遇到问题请改用 `arm64-v8a`。'
            echo '每个包都已校验签名有效。两个变体的包名相同，可以互相覆盖升级。'
            echo 'RELEASE_BODY_EOF'
          } >> "$GITHUB_ENV"

      - name: 创建 Release 并上传
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.TAG }}
          name: ${{ env.TAG }}
          draft: false
          generate_release_notes: true
          # 不能用 append_body：它是为「多步往同一 Release 追加」设计的，
          # 重跑时会叠在上一版正文后面，安装包表格出现两次。
          append_body: false
          body: ${{ env.RELEASE_BODY }}
          files: dist/*.apk