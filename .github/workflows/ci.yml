name: CI

on:
  push:
    branches: [ master ]
  pull_request:
  # 手动触发：改完可见性、或想在不提交的情况下重跑时用
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  unit-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: 设置 JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: 安装 Android SDK 35
        run: |
          SDKMANAGER=$(ls "$ANDROID_HOME"/cmdline-tools/*/bin/sdkmanager 2>/dev/null | tail -1)
          if [ -z "$SDKMANAGER" ]; then
            echo "::error::runner 上找不到 sdkmanager"
            exit 1
          fi
          yes | "$SDKMANAGER" --licenses > /dev/null 2>&1 || true
          "$SDKMANAGER" "platform-tools" "platforms;android-35" "build-tools;35.0.0"

      - name: 启用 Gradle 缓存
        uses: gradle/actions/setup-gradle@v4

      - name: 运行 JVM 单测
        run: |
          set +e
          ./gradlew :app:testDebugUnitTest --stacktrace 2>&1 | tee /tmp/build.log
          code=${PIPESTATUS[0]}
          if [ "$code" -ne 0 ]; then
            # 只截尾部 20 行会被堆栈淹掉，先取 Gradle 的「What went wrong」段
            MSG=$(awk '/What went wrong/{f=1} f{print} /Get more help/{f=0}' /tmp/build.log | tr '\n' ' ')
            [ -z "$MSG" ] && MSG=$(tail -n 40 /tmp/build.log | tr '\n' ' ')
            echo "::error title=Gradle 失败::$(printf '%s' "$MSG" | cut -c1-1200)"
          fi
          exit "$code"

      - name: 汇总失败用例
        if: failure()
        run: |
          python3 - <<'PY'
          import glob, xml.etree.ElementTree as ET
          total = 0
          for f in sorted(glob.glob('app/build/test-results/testDebugUnitTest/*.xml')):
              for tc in ET.parse(f).getroot().iter('testcase'):
                  for fail in tc.findall('failure'):
                      total += 1
                      msg = (fail.get('message') or '').strip().splitlines()
                      line = '%s#%s: %s' % (
                          tc.get('classname'), tc.get('name'), msg[0] if msg else '')
                      print('::error title=测试失败::' + line[:900])
          print('失败用例数：%d' % total)
          PY

      - name: 上传测试报告
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: app/build/test-results/testDebugUnitTest
          if-no-files-found: warn

  assemble-debug:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: 设置 JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: 安装 Android SDK 35
        run: |
          SDKMANAGER=$(ls "$ANDROID_HOME"/cmdline-tools/*/bin/sdkmanager 2>/dev/null | tail -1)
          if [ -z "$SDKMANAGER" ]; then
            echo "::error::runner 上找不到 sdkmanager"
            exit 1
          fi
          yes | "$SDKMANAGER" --licenses > /dev/null 2>&1 || true
          "$SDKMANAGER" "platform-tools" "platforms;android-35" "build-tools;35.0.0"

      - name: 启用 Gradle 缓存
        uses: gradle/actions/setup-gradle@v4

      - name: 编译 debug 包
        run: |
          set +e
          ./gradlew :app:assembleDebug --stacktrace 2>&1 | tee /tmp/build.log
          code=${PIPESTATUS[0]}
          if [ "$code" -ne 0 ]; then
            # 只截尾部 20 行会被堆栈淹掉，先取 Gradle 的「What went wrong」段
            MSG=$(awk '/What went wrong/{f=1} f{print} /Get more help/{f=0}' /tmp/build.log | tr '\n' ' ')
            [ -z "$MSG" ] && MSG=$(tail -n 40 /tmp/build.log | tr '\n' ' ')
            echo "::error title=Gradle 失败::$(printf '%s' "$MSG" | cut -c1-1200)"
          fi
          exit "$code"